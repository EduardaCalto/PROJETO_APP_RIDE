<!DOCTYPE html>
<html class="h-100" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="global.css">
</head>

<body class="h-100">

    <div class="container h-100 d-flex flex-column">
        <nav class="navbar">
            <a class="btn btn-link text-dark text-decoration-none px-0" href="./index.html">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
            <span class="fw-bold">New ride</span>
            <span style="width: 60px;"></span>
        </nav>

        <div class="speed-display d-flex flex-column justify-content-center align-items-center text-light flex-fill mb-3 rounded-4 shadow">
            <span id="status" class="badge rounded-pill text-bg-secondary mb-3">Ready</span>
            <span class="speed-value fw-bold" id="speed">0</span>
            <span class="fs-3 text-white-50">Km/h</span>
        </div>

        <button class="btn btn-primary btn-lg rounded-pill py-3 mb-3" id="start">
            <i class="bi bi-play-fill me-1"></i>Start
        </button>

        <button class="btn btn-danger btn-lg rounded-pill py-3 d-none mb-3" id="stop">
            <i class="bi bi-stop-fill me-1"></i>Stop
        </button>
    </div>
    <script src="./storage.js"></script>
    <script src="./speedometer.js"></script>
</body>

</html>

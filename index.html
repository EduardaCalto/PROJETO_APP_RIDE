<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./global.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

</head>
<body>

    <header class="app-header shadow-sm sticky-top mb-3" style="z-index: 1000;">
        <div class="container py-3 d-flex align-items-center gap-2">
            <i class="bi bi-bicycle text-primary fs-3"></i>
            <h1 class="h4 m-0 fw-bold">My Rides</h1>
        </div>
    </header>

    <main class="container pb-5 mb-5">

        <ul id="rideList" class="list-unstyled d-flex flex-column gap-3 m-0">

        </ul>

        <div id="emptyState" class="text-center text-secondary py-5 d-none">
            <i class="bi bi-signpost-split display-1"></i>
            <p class="mt-3 mb-1 fs-5">No rides yet</p>
            <p class="small">Tap the <i class="bi bi-plus-lg"></i> button to start your first ride.</p>
        </div>

    </main>

    <a href="./speedometer.html" class="fab btn btn-primary rounded-circle shadow position-fixed bottom-0 end-0 m-4" aria-label="New ride">
        <i class="bi bi-plus-lg"></i>
    </a>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="./storage.js"></script>
    <script src="./dataManager.js"></script>
    <script src="./index.js"></script>

</body>
</html>
